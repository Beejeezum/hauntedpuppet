name: Character and controller regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: regressions-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start local rehearsal server
        run: |
          python3 server.py > /tmp/wisp-server.log 2>&1 &
          python3 scripts/wait-for-server.py
      - run: npm test
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: test-results/
          if-no-files-found: ignore
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Start local rehearsal server
        run: |
          python3 server.py > /tmp/wisp-server.log 2>&1 &
          python3 scripts/wait-for-server.py
      - name: Check phone controls in WebKit
        run: PHONE_BROWSER=webkit node tests/phone_browser.cjs
      - name: Check direct voice effects in WebKit
        run: |
          HAUNT_BROWSER=webkit node tests/voice_connection_gate.cjs
          HAUNT_BROWSER=webkit node tests/prepared_audience.cjs
          HAUNT_BROWSER=webkit node tests/realtime_response_timing_browser.cjs
          HAUNT_BROWSER=webkit node tests/puppeteer_voice.cjs
      - name: Check painted eyes and apparitions in WebKit
        run: |
          HAUNT_BROWSER=webkit node tests/painted_speech_pilot.cjs
          HAUNT_BROWSER=webkit node tests/wisp_living_skin.cjs
          HAUNT_BROWSER=webkit node tests/wisp_performance_graphics.cjs
          HAUNT_BROWSER=webkit node tests/wisp_performance_continuity.cjs
          HAUNT_BROWSER=webkit node tests/wisp_layered_front.cjs
          HAUNT_BROWSER=webkit node tests/wisp_native_kit.cjs
          HAUNT_BROWSER=webkit node tests/wisp_native_morph.cjs
          HAUNT_BROWSER=webkit node tests/wisp_performance.cjs
          HAUNT_BROWSER=webkit node tests/wisp_3d_browser.cjs
          HAUNT_BROWSER=webkit node tests/wisp_3d_bounds.cjs
          HAUNT_BROWSER=webkit node tests/fluid_performance.cjs
          HAUNT_BROWSER=webkit node tests/live_rig.cjs
          HAUNT_BROWSER=webkit node tests/character_workshop.cjs
          HAUNT_BROWSER=webkit node tests/apparition_performance.cjs
          HAUNT_BROWSER=webkit node tests/spirit_atmosphere.cjs
          HAUNT_BROWSER=webkit node tests/spirit_frame.cjs
          HAUNT_BROWSER=webkit node tests/spirit_frame_app.cjs --slow-projector-art
          HAUNT_BROWSER=webkit node tests/wisp_studio_frame.cjs
      - name: Keep WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-evidence
          path: test-results/
          if-no-files-found: ignore
  native-avatar-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install isolated pilot SDK wheels
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check -r source/wisp-performance-reference/native-avatar-pilot/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check pilot lifecycle and SDK subprocess transfer without provider access
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s source/wisp-performance-reference/native-avatar-pilot -p 'test_*.py' -v 2>&1 | tee test-results/native-avatar-python.txt
      - name: Check silent local viewer with offline SDK and synthetic frames
        run: node tests/native_avatar_viewer.cjs
      - name: Keep offline pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-avatar-offline-evidence
          path: test-results/native-avatar-*
          if-no-files-found: ignore
