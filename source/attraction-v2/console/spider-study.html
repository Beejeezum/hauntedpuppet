<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silk spider · motion study</title><style>body{background:#10141b;color:#eee;font:16px system-ui;margin:24px}main{max-width:1100px;margin:auto}canvas{display:block;width:100%;background:black}button,input{font:inherit;padding:12px}p{line-height:1.5}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#b7dbe9}input{flex:1;min-width:200px}#status{min-height:24px}</style><main><h1>Silk spider · motion study</h1><p>Original painted parts, eight jointed legs and a suspended silk line. This is a silent articulation study, separate from the show. Compare shadow detail at any paused pose; the painted silhouette stays the same.</p><canvas id="stage" width="1280" height="720" aria-label="Painted spider motion study"></canvas><nav><button id="play" disabled>Play study</button><button id="stop">Blackout</button><button id="light" aria-pressed="true">Shadow detail on</button><label for="time">Time</label><input id="time" type="range" min="0" max="36" step=".05" value="0"></nav><p id="status" role="status">Loading artwork…</p><a href="./haunt-loops.html">Back to After dark</a></main><script type="module">
import{SilkSpider}from'./silk-spider.mjs';const spider=new SilkSpider(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),slider=document.querySelector('#time'),status=document.querySelector('#status');let active=false,base=0,frame;
function draw(now){ctx.clearRect(0,0,1280,720);if(spider.running)spider.draw(ctx,now);status.textContent=spider.error||spider.inspect().phase;}
function tick(){if(active){const t=performance.now()/1000-base;slider.value=t%36;draw(t);}frame=requestAnimationFrame(tick);}
document.querySelector('#light').onclick=()=>{spider.light=spider.light?0:.16;const button=document.querySelector('#light');button.textContent=spider.light?'Shadow detail on':'Original shadows';button.setAttribute('aria-pressed',String(!!spider.light));if(!active&&spider.running)draw(Number(slider.value));};
play.onclick=()=>{active=!active;play.textContent=active?'Pause study':'Play study';if(active){if(!spider.running)spider.start(0);base=performance.now()/1000-Number(slider.value);}};
slider.oninput=()=>{active=false;play.textContent='Play study';if(!spider.running)spider.start(0);draw(Number(slider.value));};document.querySelector('#stop').onclick=()=>{active=false;spider.stop();slider.value=0;play.textContent='Play study';draw(0);};window.addEventListener('pagehide',()=>{active=false;cancelAnimationFrame(frame);spider.dispose();});await spider.load();play.disabled=!spider.ready;status.textContent=spider.error||'Ready. No audio or generation credits needed to play.';window.WispSpiderStudy={inspect:()=>spider.inspect()};tick();
</script></html>
