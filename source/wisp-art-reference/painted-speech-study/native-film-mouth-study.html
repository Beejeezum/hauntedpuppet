<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native painted Wisp — mouth study</title>
<style>body{margin:0;background:#10121b;color:#eee;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}canvas{width:100%;background:black}button,label{margin:8px}button{padding:12px}video{display:none}</style>
<main><h1>Painted film + speaking-mouth study</h1><p>Unapproved source study. Original body/fog film, candidate tracked mouth and painted shapes. Synthetic motion only—no voice, camera or microphone.</p><button id="play" disabled>Play silent study</button><button id="stop">Stop</button><label>Shape<select id="shape"><option value="AH">Ah</option><option value="OO">Oo</option><option value="EE">Ee</option></select></label><button id="approved">Load existing Wisp apology</button><label>Speech shapes<select id="timing"><option value="acoustic">Acoustic estimate</option><option value="aligned" disabled>Automatic text alignment · candidate</option></select></label><label>Local voice sample<input id="audioFile" type="file" accept="audio/*"></label><button id="voice" disabled>Play local voice on laptop</button><p>Audio stays on this computer. Mouth shapes are acoustic estimates, not phoneme alignment.</p><p id="status">Loading…</p><canvas width="1916" height="1080"></canvas><video muted playsinline loop></video></main>
<script type="module">
import {FilmAudioMouthDriver} from './film-audio-mouth-driver.mjs';
import {NativeFilmMouthStudy} from './native-film-mouth-study.mjs';
const study=new NativeFilmMouthStudy(),video=document.querySelector('video'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');let disposed=false,stopped=false,frame,audioContext,audioDriver,audioBuffer,loadEpoch=0,performanceEpoch=0,usingAudio=false,timings=null;
video.src='../../wisp-performance-reference/runway-pilots/continuous-loop-study/wisp-continuous-loop-v28.mp4';
function draw(){if(disposed)return;if(!stopped&&video.readyState>=2){ctx.drawImage(video,0,0);const opening=video.paused?0:(1-Math.cos(video.currentTime*Math.PI*5))*.5;study.draw(ctx,video,usingAudio?(audioDriver?.sample()||{rest:1}):{rest:1-opening,[document.querySelector('#shape').value]:opening});}frame=requestAnimationFrame(draw)}
try{await Promise.all([study.load(),new Promise((r,j)=>{video.onloadeddata=r;video.onerror=j})]);play.disabled=false;status.textContent='Candidate study ready. Check mouth placement, patch edges and continuous body motion.';draw()}catch(e){status.textContent=e.message;study.dispose()}
play.onclick=async()=>{const epoch=++performanceEpoch;audioDriver?.stop();usingAudio=false;try{stopped=false;await video.play();if(disposed||epoch!==performanceEpoch)video.pause()}catch(e){status.textContent=e.message}};
document.querySelector('#audioFile').onchange=async event=>{const epoch=++loadEpoch;audioDriver?.stop();timings=null;document.querySelector('#timing').value='acoustic';document.querySelector('#timing option[value=aligned]').disabled=true;document.querySelector('#voice').disabled=true;audioBuffer=null;const file=event.target.files[0];if(!file)return;if(file.size>15000000){status.textContent='Use an audio sample below 15 MB';return;}try{audioContext||=new AudioContext();const decoded=await audioContext.decodeAudioData(await file.arrayBuffer());if(disposed||epoch!==loadEpoch)return;if(decoded.duration>45)throw Error('Use a sample below 45 seconds');audioBuffer=decoded;document.querySelector('#voice').disabled=false;status.textContent='Local sample ready; no upload or provider request.';}catch(e){if(!disposed&&epoch===loadEpoch)status.textContent=e.message}};
document.querySelector('#approved').onclick=async()=>{const epoch=++loadEpoch;audioDriver?.stop();audioBuffer=null;document.querySelector('#voice').disabled=true;try{audioContext||=new AudioContext();const data=await fetch('./apology-alignment-candidate.json').then(r=>{if(!r.ok)throw Error('Candidate timing unavailable');return r.json()}),bytes=await fetch('../../wisp-performance-reference/tonight-demo/apology-proof-v1.mp4').then(r=>{if(!r.ok)throw Error('Existing voice sample unavailable');return r.arrayBuffer()});const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hash!==data.sourceSha256)throw Error('Voice sample changed; timing must be reviewed again');const decoded=await audioContext.decodeAudioData(bytes);if(disposed||epoch!==loadEpoch)return;audioBuffer=decoded;timings=data.visemes;document.querySelector('#timing option[value=aligned]').disabled=false;document.querySelector('#timing').value='aligned';document.querySelector('#voice').disabled=false;status.textContent='Existing approved voice loaded. New automatic mouth timings need visual review.';}catch(e){if(!disposed&&epoch===loadEpoch)status.textContent=e.message}};
document.querySelector('#voice').onclick=async()=>{const epoch=++performanceEpoch;try{if(!audioBuffer||disposed)return;await audioContext.resume();if(disposed||epoch!==performanceEpoch)return;audioDriver||=new FilmAudioMouthDriver(audioContext);stopped=false;usingAudio=true;await video.play();if(disposed||epoch!==performanceEpoch){video.pause();return;}audioDriver.play(audioBuffer,{visemes:document.querySelector('#timing').value==='aligned'?(timings||[]):[]})}catch(e){status.textContent=e.message}};
document.querySelector('#stop').onclick=()=>{performanceEpoch++;stopped=true;audioDriver?.stop();video.pause();ctx.clearRect(0,0,canvas.width,canvas.height)};
window.addEventListener('pagehide',()=>{disposed=true;loadEpoch++;performanceEpoch++;audioBuffer=null;audioDriver?.dispose();audioContext?.close();cancelAnimationFrame(frame);video.pause();video.removeAttribute('src');video.load();study.dispose()},{once:true});
</script>
