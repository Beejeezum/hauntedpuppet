<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisp finite-cue playback study</title>
<style>body{margin:24px;background:#10131a;color:#eef3fa;font:17px system-ui;max-width:1000px}video{display:block;width:100%;height:min(54vh,560px);object-fit:contain;background:black}button{padding:14px;margin:8px 8px 8px 0;font:inherit}output{display:block;margin:12px 0}label{display:block;margin:16px 0}</style>
<h1>Finite-cue playback study</h1><p>Private playback mechanics proof. Two existing painted sections, one native player. These are not approved runtime cues. The reverse order tests decoding, not a designed visual join.</p>
<video muted playsinline></video><label><input type="checkbox" id="sound"> Enable this laptop’s sound</label>
<button data-order="friendly">Friendly only</button><button data-order="forward">Friendly → morph</button><button data-order="reverse">Morph → friendly (stress test)</button><button data-order="stream">Queue while playing</button><button id="stop">Blackout / Stop</button><output aria-live="polite">Ready. Sound is off.</output>
<script type="module">
import {FiniteCueStudy} from './finite-player.mjs';
const video=document.querySelector('video'),status=document.querySelector('output'),sound=document.querySelector('#sound'),buttons=[...document.querySelectorAll('[data-order]')],player=new FiniteCueStudy(video);
const a={id:'friendly',url:new URL('./friendly-drift.mp4',import.meta.url).href,frames:122,fps:24},b={id:'morph',url:new URL('./cute-to-evil.mp4',import.meta.url).href,frames:121,fps:24};let epoch=0;
const applySound=()=>{video.muted=!sound.checked;video.volume=sound.checked?1:0;};sound.onchange=applySound;
buttons.forEach(button=>button.onclick=async()=>{const own=++epoch;buttons.forEach(b=>b.disabled=true);status.textContent='Preparing selected media…';try{const streaming=button.dataset.order==='stream';await player.prepare(streaming?[a]:button.dataset.order==='friendly'?[a]:button.dataset.order==='forward'?[a,b]:[b,a],{open:streaming});if(own!==epoch)return;applySound();await player.play();if(own!==epoch)return;if(streaming)await player.append([b,a],{seal:true});if(own===epoch)status.textContent='Playing selected finite sequence.';}catch(error){if(own===epoch)status.textContent='Not playing: '+error.message;}finally{if(own===epoch)buttons.forEach(b=>b.disabled=false);}});
document.querySelector('#stop').onclick=()=>{epoch++;player.stop();buttons.forEach(b=>b.disabled=false);status.textContent='Stopped. No later movie section can play.';};
video.onended=()=>{status.textContent='Selected sequence ended.';};
window.addEventListener('pagehide',()=>{epoch++;player.dispose();},{once:true});
</script></html>
