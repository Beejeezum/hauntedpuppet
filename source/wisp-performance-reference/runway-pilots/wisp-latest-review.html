<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wisp · latest performance review</title>
<style>body{margin:0;background:#101014;color:#eee;font:17px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}p{line-height:1.5;color:#c9c9d5}video{display:block;width:100%;background:#000;aspect-ratio:1916/1080}button,select{font:inherit;padding:12px;background:#292936;color:#fff;border:1px solid #727285;border-radius:8px}label{display:block;margin:18px 0 8px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}a{color:#ccc4ff}#blackout{border-color:#df9393}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #d8b6ff;outline-offset:4px}</style>
<main><h1>Wisp · latest performance review</h1><p>Choose a study, then press Play. These are character studies, not finished show loops. This page never opens your microphone or camera.</p>
<label for="study">Performance</label><select id="study">
<option value="identity">Full body → evil morph → scary turn</option><option value="loop">Fuller friendly idle · three cycles</option><option value="speech" selected>Talking Wisp · restored proportions</option><option value="departure">Turn away, disappear, friendly return</option><option value="turn">Scary turn · chosen motion direction</option><option value="fog">Soft fog disappearance · needs revision</option></select>
<p id="note"></p><video id="player" controls muted playsinline preload="metadata"></video><div class="controls"><button id="sound" type="button" aria-pressed="false">Enable sample sound</button><button id="blackout" type="button">Blackout / stop</button></div><p id="status" role="status">Paused · sound off</p><p><a href="character-speech-study/reference-proportion-review-v1.png">Compare source and talking proportions</a> · <a href="wisp-motion-review.html">Full show rehearsal</a></p></main>
<script type="module">
const studies={identity:{file:'identity-morph-study/wisp-fuller-identity-performance-v3.mp4',note:'15-second whole-character review: fuller friendly motion, existing forward morph and endorsed scary turn. Not a loop, reverse transformation or live speech. Back anatomy and ending holds remain unfinished.'},loop:{file:'continuous-loop-study/wisp-continuous-loop-v28-three-cycles.mp4',note:'Three direct repetitions of a new endpoint-conditioned body performance. Complete smoke buffer passes; ending slows. Judge repeated seams and changing body shape. Not yet approved or live.'},speech:{file:'character-speech-study/wisp-character-speech-v2-proportion-review.mp4',note:'Fictional Runway voice sample. Portrait proportions restored locally; audio unchanged. Body motion is still too subtle. Not native live voice.',audio:true},departure:{file:'spatial-disappearance-study/wisp-departure-friendly-return-v27.mp4',note:'Genuine painted turn with curved perspective compositing, then 2.667 seconds of empty stage before a friendly arrival. Not a visible morph or new 3D geometry.'},turn:{file:'scary-identity-study/wisp-scary-guided-turn-v18-safe-framing.mp4',note:'Human-endorsed full-body motion direction. Back and arm anatomy remain unfinished.'},fog:{file:'spatial-disappearance-study/wisp-poof-v25-safe-framing.mp4',note:'Softer billowing exit with safe framing, but departure happens too late and arms look too solid. Not an approved show clip.'}};
const player=document.querySelector('#player'),study=document.querySelector('#study'),sound=document.querySelector('#sound'),status=document.querySelector('#status');
function silence(){player.muted=true;sound.setAttribute('aria-pressed','false');sound.textContent='Enable sample sound';}
function select(){player.pause();silence();const item=studies[study.value];player.src=item.file;player.load();document.querySelector('#note').textContent=item.note;sound.disabled=!item.audio;status.textContent='Paused · sound off';}
study.addEventListener('change',select);sound.addEventListener('click',()=>{player.muted=!player.muted;sound.setAttribute('aria-pressed',String(!player.muted));sound.textContent=player.muted?'Enable sample sound':'Mute sample sound';status.textContent=player.muted?'Sound off':'Sample sound enabled · press Play';});
document.querySelector('#blackout').addEventListener('click',()=>{player.pause();silence();player.removeAttribute('src');player.load();status.textContent='Blackout · stopped · sound off';});
player.addEventListener('error',()=>{status.textContent='Clip unavailable · choose another study';});
select();
</script></html>
