<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Wisp · 3D sculpt studio</title><style>body{margin:0;background:#080a12;color:#eee;font:16px system-ui}main{max-width:1280px;margin:auto;padding:20px}canvas{width:100%;background:#000;max-height:74vh;object-fit:contain}button,input{font:inherit;margin:8px;min-height:42px}label{display:inline-block}a{color:#bdf}button{background:#302746;color:#fff;border:1px solid #9a8bac;border-radius:8px;padding:8px 14px}</style><main><a href="/">Operator console</a><h1>Wisp · living 3D sculpt</h1><div id="stage"></div><label>Cute → evil<input id="evil" type="range" min="0" max="100" value="0"></label><label>Turn<input id="turn" type="range" min="-180" max="180" value="0"></label><label>Talk<input id="jaw" type="range" min="0" max="100" value="0"></label><button id="wave">Wave</button><button id="dance">Dance</button><button id="spin">Turn around</button><button id="blink">Blink</button><p id="status">Loading editable rig…</p></main><script type="module">import{Wisp3DRuntime}from'./wisp-3d-runtime.js';const rig=new Wisp3DRuntime();await rig.load();document.querySelector('#stage').append(rig.canvas);let action={kind:'',at:100},started=0,blinkAt=-100;for(const[id,kind]of[['wave','wave'],['dance','dance'],['spin','twirl']])document.querySelector('#'+id).onclick=()=>{action={kind};started=performance.now()/1000};document.querySelector('#blink').onclick=()=>blinkAt=performance.now()/1000;let last=performance.now();function frame(now){const t=now/1000;rig.render({clock:t,dt:(now-last)/1000,action:{...action,at:t-started},state:'speaking',jaw:document.querySelector('#jaw').value/100,blink:t-blinkAt<.2?1:0,viewYaw:document.querySelector('#turn').value*Math.PI/180,motion:{gesture:100}},document.querySelector('#evil').value/100);last=now;document.querySelector('#status').textContent=rig.error||'24 bones · shared topology · independent eyes, lids, brows and mouth';requestAnimationFrame(frame)}requestAnimationFrame(frame);window.Wisp3DStudio={inspect:()=>rig.inspect(),rig};</script></html>
